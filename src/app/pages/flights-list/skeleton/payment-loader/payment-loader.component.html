<section class="payment-loader">
    <div class="container container-xxl">
        <div class="payment-loader-content">
            <div class="payment-loader-img-box">

                <div class="pay" role="status" aria-label="Payment processing">
                    <header class="merchant">
                    </header>

                    <div class="stage" aria-hidden="true">
                        <!-- Card -->
                        <div class="layer layer-card">
                            <div class="mini-card">
                                <div class="card-top">
                                    <span class="chip"></span>
                                    <i class="fa-solid fa-wifi"></i>
                                </div>
                                <div class="card-num">•••• •••• •••• 4242</div>
                                <div class="card-bottom">
                                    <span>12 / 28</span>
                                    <i class="fa-brands fa-cc-visa"></i>
                                </div>
                            </div>
                        </div>

                        <!-- Processing -->
                        <div class="layer layer-proc">
                            <div class="proc">
                                <span class="ring"></span>
                                <span class="ring inner"></span>
                                <i class="fa-solid fa-lock"></i>
                            </div>
                        </div>

                        <!-- Success -->
                        <div class="layer layer-done">
                            <div class="done">
                                <span class="ripple"></span>
                                <span class="ripple r2"></span>
                                <div class="burst">
                                    <span style="--a:0deg;   --c:#18B87A"></span>
                                    <span style="--a:45deg;  --c:#3A4DF0"></span>
                                    <span style="--a:90deg;  --c:#F5C04B"></span>
                                    <span style="--a:135deg; --c:#7B3AF0"></span>
                                    <span style="--a:180deg; --c:#18B87A"></span>
                                    <span style="--a:225deg; --c:#3A4DF0"></span>
                                    <span style="--a:270deg; --c:#F5C04B"></span>
                                    <span style="--a:315deg; --c:#7B3AF0"></span>
                                </div>
                                <div class="done-badge"><i class="fa-solid fa-check"></i></div>
                            </div>
                        </div>
                    </div>

                    <div class="status">
                        <span class="s1">Reading card</span>
                        <span class="s2">Authorizing payment<span class="dots"></span></span>
                        <span class="s3">Payment complete</span>
                    </div>

                    <ol class="steps">
                        <span class="track"></span>
                        <span class="fill"></span>
                        <li class="step st1"><span class="dot"><i class="fa-solid fa-credit-card"></i></span>Card</li>
                        <li class="step st2"><span class="dot"><i class="fa-solid fa-shield-halved"></i></span>Verify
                        </li>
                        <li class="step st3"><span class="dot"><i class="fa-solid fa-check"></i></span>Done</li>
                    </ol>
                </div>
            </div>
            <div class="payment-loader-content-box">
                <div class="payment-loader-content-title-box">
                    <h3 class="payment-loader-content-title">Please hold tight</h3>
                    <h3 class="payment-loader-content-title">while we process your ticket.</h3>
                </div>
                <div class="payment-loader-content-text-box">
                    <p class="payment-loader-content-text">Kindly avoid refreshing the page.</p>
                    <p class="payment-loader-content-text">We'll notify you shortly.</p>
                </div>
            </div>
        </div>
    </div>
</section>
