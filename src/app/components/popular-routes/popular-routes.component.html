<div class="tp-route-grid">

  <a *ngFor="let route of routes"
     class="tp-route-card"
     role="button"
     tabindex="0"
     [class.is-loading]="loadingRoute === route"
     [attr.aria-busy]="loadingRoute === route"
     [attr.aria-label]="'Search flights from ' + route.fromLabel + ' to ' + route.toLabel"
     (click)="searchRoute(route)"
     (keydown.enter)="searchRoute(route)">

    <div class="tp-route-city">
      <span class="tp-route-label">From</span>
      <h5>{{ route.fromLabel }}</h5>
    </div>

    <div class="tp-route-flight">
      <span class="tp-route-line"></span>
      <i class="fa-solid fa-plane"></i>
      <span class="tp-route-line"></span>
    </div>

    <div class="tp-route-city">
      <span class="tp-route-label">To</span>
      <h5>{{ route.toLabel }}</h5>
    </div>

  </a>

</div>
